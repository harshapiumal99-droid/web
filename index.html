<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>For Sudu Nona 🤍</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #fafafa; color: #242424;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    width: min(100%, 470px); text-align: center; background: #fff;
    border: 1px solid #eeeeee; border-radius: 28px; padding: 38px 25px 34px;
    box-shadow: 0 18px 55px rgba(0,0,0,.045);
  }
  .heart { color: #c7a6a6; font-size: 25px; margin-bottom: 17px; }
  .eyebrow { color: #929292; text-transform: uppercase; letter-spacing: .19em; font-size: 10px; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(34px, 9vw, 47px); margin: 13px 0 8px; }
  .sub { color: #777; font-size: 14px; line-height: 1.7; margin: 0 auto; max-width: 310px; }
  .count { display: flex; justify-content: center; gap: 10px; margin: 31px 0 24px; }
  .unit { min-width: 68px; padding: 15px 8px 12px; background: #faf9f8; border-radius: 15px; }
  .num { display: block; font-size: 29px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .label { display: block; color: #999; font-size: 9px; letter-spacing: .13em; margin-top: 5px; }
  .date { font-size: 12px; color: #777; letter-spacing: .12em; }
  .line { width: 38px; height: 1px; background: #e7dddd; margin: 25px auto; }
  .message { font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #555; }
  .signature { margin-top: 22px; font-size: 12px; color: #999; }
  .signature span { color: #c7a6a6; }
  footer { color: #b0b0b0; font-size: 10px; margin-top: 27px; letter-spacing: .08em; }
  @media (max-width: 360px) { .count { gap: 6px; } .unit { min-width: 58px; } .num { font-size: 25px; } }
</style>
</head>
<body>
<main>
  <div class="heart">♡</div>
  <div class="eyebrow">A little countdown for</div>
  <h1>Sudu Nona</h1>
  <p class="sub">One day closer to the dream you’re working so hard for.</p>
  <section class="count" aria-label="Countdown">
    <div class="unit"><span class="num" id="days">--</span><span class="label">DAYS</span></div>
    <div class="unit"><span class="num" id="hours">--</span><span class="label">HOURS</span></div>
    <div class="unit"><span class="num" id="minutes">--</span><span class="label">MINUTES</span></div>
    <div class="unit"><span class="num" id="seconds">--</span><span class="label">SECONDS</span></div>
  </section>
  <div class="date">04 JANUARY 2027</div>
  <div class="line"></div>
  <div class="message">Keep believing in yourself, my love.<br>Every little effort matters.<br>You’ve got this. 🤍</div>
  <div class="signature">Always cheering for you <span>♡</span></div>
  <footer>MADE WITH LOVE · JUST FOR YOU</footer>
</main>
<script>
  const target = new Date(2027, 0, 4, 0, 0, 0).getTime();
  const ids = ["days", "hours", "minutes", "seconds"];
  function update() {
    let diff = Math.max(0, target - Date.now());
    const values = [
      Math.floor(diff / 86400000),
      Math.floor(diff / 3600000) % 24,
      Math.floor(diff / 60000) % 60,
      Math.floor(diff / 1000) % 60
    ];
    ids.forEach((id, i) => document.getElementById(id).textContent = String(values[i]).padStart(2, "0"));
    if (diff === 0) document.querySelector(".sub").textContent = "Today is your day. Go shine, Sudu Nona! 🤍";
  }
  update(); setInterval(update, 1000);
</script>
</body>
</html>
